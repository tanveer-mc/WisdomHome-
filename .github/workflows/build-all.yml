          <div id="stage">
           <div class="top"><div class="brand">Wisdom Home</div><div style="display:flex;align-items:center;gap:22px"><div><span id="clk"></span><span id="dt"></span></div><div class="t" tabindex="0" data-n="Launcher settings"><svg class="ic"><use href="#i-gear"/></svg>Launcher</div></div></div>
           <div class="row" style="gap:20px">
            <div class="t hero" tabindex="0" data-n="Live TV"><span>Wisdom Share</span><small>Smart cloud TV · press OK for Live TV</small></div>
            <div class="inputs" id="inp"></div>
           </div>
           <h3>Favourite apps</h3>
           <div class="row apps" id="fav"></div>
           <div id="eb"></div>
           <div class="hint" id="hint">Arrows move · OK opens · Menu opens settings</div>
