          </div>
          <div id="toast"></div><div id="dim"></div><div id="warm"></div><div id="ss"><div id="sk"><span></span><small></small></div></div>
          <div id="pad">
           <button data-k="Menu">≡</button><button data-k="ArrowUp">▲</button><button data-k="Escape">⟲</button>
           <button data-k="ArrowLeft">◀</button><button data-k="Enter">OK</button><button data-k="ArrowRight">▶</button>
           <span></span><button data-k="ArrowDown">▼</button><span></span>
          </div>
          <script>
          const $=id=>document.getElementById(id),st=$('stage');
          const ic=n=>'<svg class="ic"><use href="#i-'+n+'"/></svg>';
          const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
          const HAS=!!window.Android;const J=f=>{try{return JSON.parse(f)}catch(e){return[]}};
          const INP=[['ATV','tv'],['AV 1','av'],['AV 2','av'],['HDMI 1','hdmi'],['HDMI 2','hdmi'],['TV Settings','tvset'],['Browser','globe'],['App Store','bag'],['TV Assistant','tool'],['Network','wifi'],['Games','grid']];
          const ICS=['grid','play','folder','globe','bag','tool','tv'];
          const LINKS={Browser:'https://www.google.com',YouTube:'https://m.youtube.com','App Store':'https://play.google.com/store/apps'};
          let favs=[{n:'Apps',i:'grid'},{n:'Media',i:'play'},{n:'YouTube',i:'play'},{n:'Files',i:'folder'}],theme='',edit=false,grab=null,wp='',qs={b:100,v:50,wifi:true,bt:false,night:false,mute:false};
          try{const s=JSON.parse(localStorage.getItem('wh')||'null');if(s){favs=s.f||favs;theme=s.t||'';wp=s.w||'';qs=Object.assign(qs,s.q||{})}}catch(e){}
          function save(){try{localStorage.setItem('wh',JSON.stringify({f:favs,t:theme,w:wp,q:qs}))}catch(e){}}
          function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);st.style.transform='translate(-50%,-50%) scale('+s+')'}
          addEventListener('resize',fit);fit();
          function clock(){const d=new Date();$('clk').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});$('dt').textContent=d.toLocaleDateString([], {weekday:'short',day:'numeric',month:'short'})}
          clock();setInterval(clock,20000);
          function say(m){const t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(say.h);say.h=setTimeout(()=>t.style.opacity=0,1400)}
          function applyTheme(){document.body.className=theme+(edit?' edit':'')}
          function render(f){
           $('inp').innerHTML=INP.map(a=>'<div class="t" tabindex="0" data-n="'+a[0]+'">'+ic(a[1])+a[0]+'</div>').join('');
           $('fav').innerHTML=favs.map((a,k)=>'<div class="t" tabindex="0" data-f="'+k+'" data-n="'+esc(a.n)+'">'+ic(a.i)+esc(a.n)+'</div>').join('')+'<div class="t" tabindex="0" data-add="1" data-n="Add app">'+ic('plus')+'Add app</div>';
           $('eb').innerHTML='<div class="t" tabindex="0" data-a="ren">'+ic('edit')+'Rename</div><div class="t" tabindex="0" data-a="del">'+ic('trash')+'Remove</div><div class="t" tabindex="0" data-a="done">'+ic('check')+'Done</div>';
           applyTheme();
           if(f!=null){const e=document.querySelector('[data-f="'+f+'"]');e&&e.focus()}
          }
          let lastT=null;document.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('t'))lastT=e.target});
          function cur(){const a=document.activeElement;if(a&&a.tagName=='INPUT')return null;if(a&&a.classList.contains('t'))return a;return lastT&&lastT.isConnected&&lastT.offsetParent?lastT:null}
          function scope(){return [...($('pn').classList.contains('o')?$('cd'):st).querySelectorAll('.t')].filter(e=>e.offsetParent)}
          function move(k){
           const L=scope(),c=cur()&&L.includes(cur())?cur():L[0];if(!c)return;
           if(grab!=null){if(c.dataset.f==null||!(k=='ArrowLeft'||k=='ArrowRight'))return;
            const i=+c.dataset.f,j=k=='ArrowLeft'?i-1:i+1;if(j<0||j>=favs.length)return;
            [favs[i],favs[j]]=[favs[j],favs[i]];grab=j;save();render(j);document.querySelector('[data-f="'+j+'"]').classList.add('grab');return}
           const r=c.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let b=null,bd=1e9;
           L.forEach(e=>{if(e===c)return;const q=e.getBoundingClientRect(),x=q.left+q.width/2-cx,y=q.top+q.height/2-cy,H=k=='ArrowLeft'||k=='ArrowRight';
            const ok=k=='ArrowRight'?x>10&&Math.abs(y)<Math.abs(x)+60:k=='ArrowLeft'?x<-10&&Math.abs(y)<Math.abs(x)+60:k=='ArrowDown'?y>10&&Math.abs(x)<Math.abs(y)*1.5+160:y<-10&&Math.abs(x)<Math.abs(y)*1.5+160;
            if(!ok)return;const d=H?Math.abs(x)+Math.abs(y)*2:Math.abs(y)+Math.abs(x)*2;if(d<bd){bd=d;b=e}});
           if(b)b.focus()}
          function panel(){
           const th=[['','Midnight','#2ee6c5'],['sunset','Sunset','#ffb703'],['forest','Forest','#9be564'],['light','Light','#e63946']];
           $('cd').innerHTML='<h2>Settings</h2><div class="row">'+th.map(a=>'<div class="t" tabindex="0" data-th="'+a[0]+'"><span class="sw" style="background:'+a[2]+'"></span>'+a[1]+'</div>').join('')+'</div><div class="row"><div class="t" tabindex="0" data-p="wp">'+ic('palette')+'Wallpaper</div><div class="t" tabindex="0" data-p="qs">'+ic('gear')+'Quick settings</div></div>'+(HAS?'<div class="row"><div class="t" tabindex="0" data-p="home">'+ic('tv')+'Home mode: '+(Android.homeEnabled()?'On':'Off')+'</div><div class="t" tabindex="0" data-p="orig">'+ic('tv')+'Original home</div><div class="t" tabindex="0" data-p="uninstall">'+ic('trash')+'Uninstall</div></div>':'')+'<div class="row"><div class="t" tabindex="0" data-p="edit">'+ic('edit')+'Edit apps</div><div class="t" tabindex="0" data-p="reset">'+ic('trash')+'Reset</div><div class="t" tabindex="0" data-p="close">'+ic('check')+'Close</div></div>';
           $('pn').classList.add('o');$('cd').querySelector('.t').focus()}
          function closeP(){stopSnake();$('cd').className='card';$('pn').classList.remove('o');const e=document.querySelector('[data-n="Launcher settings"]');e&&e.focus()}
          function ok(){
           if(dlg&&!cur()){submit();return}const c=cur();if(!c)return;const d=c.dataset;if(d.dlg=='ok'){submit();return}if(d.dlg=='no'){cancel();return}
           if(d.th!=null){theme=d.th;save();applyTheme();say('Theme changed');return}
           if(d.p=='close'){closeP();return}if(d.p=='reset'){if(!rs){rs=1;say('Press OK again to reset');setTimeout(()=>rs=0,4000);return}rs=0;resetAll();return}if(d.p=='wp'){wpPanel();return}if(d.p=='qs'){qsPanel();return}if(d.w!=null){wp=d.w;save();applyWp();say('Wallpaper changed');return}if(d.q){qAct(d.q);return}if(d.g){game(d.g);return}if(d.c!=null){tttMove(+d.c);return}if(d.pk){if(d.m=='add'){favs.push({n:d.pn,i:'grid',p:d.pk});save();closeP();render(favs.length-1)}else{Android.launch(d.pk);closeP()}return}if(d.p=='uninstall'){Android.uninstall();return}if(d.p=='orig'){say(Android.originalHome());return}if(d.p=='home'){Android.setHome(!Android.homeEnabled());say(Android.homeEnabled()?'Home mode on. Choose Just once while testing':'Home mode off');panel();return}
           if(d.p=='edit'){edit=true;applyTheme();closeP();document.querySelector('[data-f="0"]').focus();$('hint').textContent='Edit mode: OK grabs an app, then ◀ ▶ moves it';return}
           if(d.a=='done'){exitEdit();say('Saved');return}
           if(d.a){act(d.a,lastF);return}
           if(d.add&&HAS){appsPanel('add');return}if(d.add){ask('App name','',n=>{favs.push({n:n,i:ICS[favs.length%ICS.length]});save();render(favs.length-1)});return}
           if(d.f!=null&&edit){lastF=+d.f;if(grab==null){grab=+d.f;c.classList.add('grab');say('Grabbed: use ◀ ▶')}else{grab=null;c.classList.remove('grab');say('Dropped')}return}
           if(d.n==='Launcher settings'){panel();return}if(d.n==='Games'){gPanel();return}if(HAS&&native(c)){return}
           const u=LINKS[d.n];say(u?'Opening '+d.n:d.n==='TV Settings'?'In the APK this opens the TV\'s own settings':d.n+': available in the real APK');if(u){try{if(!window.open(u,'_blank'))say('Popup blocked, could not open the link')}catch(e){}}}
          let lastF=0;
          function act(a,k){if(!favs[k])return;
           if(a=='ren'){ask('New name',favs[k].n,n=>{favs[k].n=n;save();render(k)})}
           if(a=='del'){favs.splice(k,1);save();grab=null;lastF=0;render(favs.length?Math.max(0,k-1):null);if(!favs.length)document.querySelector('[data-add]').focus()}}
          let dlg=null;
          function ask(t,v,cb){dlg=cb;$('cd').innerHTML='<h2>'+t+'</h2><input id="in" maxlength="20" style="font-size:22px;padding:12px;border-radius:12px;border:2px solid var(--hi);background:var(--tile);color:var(--tx)"><div class="row"><div class="t" tabindex="0" data-dlg="ok">'+ic('check')+'Save</div><div class="t" tabindex="0" data-dlg="no">Cancel</div></div>';$('in').value=v;$('pn').classList.add('o');$('in').focus()}
          function submit(){const n=$('in')?$('in').value.trim():'';const cb=dlg;dlg=null;$('pn').classList.remove('o');if(n&&cb)cb(n)}
          function cancel(){dlg=null;$('pn').classList.remove('o');const e=document.querySelector('.t');e&&e.focus()}
          function exitEdit(){edit=false;grab=null;render();$('hint').textContent='Arrows move · OK opens · Menu opens settings';(document.querySelector('[data-f="0"]')||document.querySelector('.hero')).focus()}
          function key(k){if(snk&&!snk.over&&k.startsWith('Arrow')){sdir(k);return}
           if(k=='Enter')ok();else if(k=='Menu'){if(!dlg){$('pn').classList.contains('o')?closeP():panel()}}
           else if(k=='Escape'){if(dlg)cancel();else if($('pn').classList.contains('o'))closeP();else if(edit)exitEdit()}
           else{const c=cur();if(c&&c.dataset.f!=null)lastF=+c.dataset.f;move(k)}}
          addEventListener('keydown',e=>{if(e.target.tagName=='INPUT'){if(e.key=='Enter'){e.preventDefault();submit()}else if(e.key=='Escape')cancel();else if(e.key=='ArrowDown'){e.preventDefault();document.querySelector('[data-dlg="ok"]').focus()}return}const m={ContextMenu:'Menu',F1:'Menu',m:'Menu',Backspace:'Escape'}[e.key]||e.key;if(m.startsWith('Arrow')||['Enter','Menu','Escape'].includes(m)){e.preventDefault();key(m)}});
          document.querySelectorAll('#pad button').forEach(b=>{b.tabIndex=-1;['mousedown','pointerdown'].forEach(ev=>b.addEventListener(ev,e=>e.preventDefault()));b.addEventListener('click',()=>key(b.dataset.k))});
          st.addEventListener('click',e=>{const t=e.target.closest('.t');if(t){t.focus();ok()}});
          const WP={'':['Default',''],aur:['Aurora','linear-gradient(160deg,#0f2027,#203a43,#2c5364)'],dusk:['Dusk','linear-gradient(160deg,#41295a,#2f0743)'],ember:['Ember','radial-gradient(900px 500px at 85% 0,#ff7e5f66,transparent),#1b1020'],mint:['Mint','linear-gradient(160deg,#134e5e,#71b280)'],ink:['Ink','#000']};
          function native(c){const d=c.dataset,n=d.n;
           if(d.f!=null){const f=favs[+d.f];if(f&&f.p){Android.launch(f.p);return true}}
           if(n=='Apps'){appsPanel('launch');return true}
           const S={'TV Settings':'tv','Network':'network'};if(S[n]){Android.settings(S[n]);return true}
           if(/^(HDMI|AV|ATV)/.test(n)){say(Android.input(n));return true}
           if(n=='Live TV'){say(Android.input('ATV'));return true}
           if(['Browser','YouTube','App Store','Media','Files','TV Assistant'].includes(n)){if(Android.launchLabel(n))return true;if(LINKS[n]){Android.openUrl(LINKS[n]);return true}say(n+' is not installed on this TV');return true}
           return false}
          function appsPanel(mode){const L=J(Android.apps());$('cd').className='card big';
           $('cd').innerHTML='<h2>'+(mode=='add'?'Add favourite app':'All apps')+' ('+L.length+')</h2><div class="grid3">'+L.map(a=>'<div class="t" tabindex="0" data-pk="'+esc(a.p)+'" data-pn="'+esc(a.n)+'" data-m="'+mode+'">'+esc(a.n)+'</div>').join('')+'</div><div class="row"><div class="t" tabindex="0" data-p="close">'+ic('check')+'Close</div></div>';openP()}
          function applyWp(){st.style.background=(WP[wp]||WP[''])[1]}
          function applyQ(){$('dim').style.opacity=(100-qs.b)/100*0.85;$('warm').style.opacity=qs.night?0.35:0}
          function openP(){$('pn').classList.add('o');const e=$('cd').querySelector('.t');e&&e.focus()}
          function wpPanel(){const k=Object.keys(WP);let h='<h2>Wallpaper</h2>';for(let i=0;i<k.length;i+=3)h+='<div class="row">'+k.slice(i,i+3).map(x=>'<div class="t" tabindex="0" data-w="'+x+'"><span class="sw" style="background:'+(WP[x][1]||'var(--bg2)')+';border:1px solid var(--mu)"></span>'+WP[x][0]+'</div>').join('')+'</div>';$('cd').innerHTML=h+'<div class="row"><div class="t" tabindex="0" data-p="close">'+ic('check')+'Close</div></div>';openP()}
          function qsPanel(f){const R=(q,l)=>'<div class="t" tabindex="0" data-q="'+q+'">'+l+'</div>',o=v=>v?'On':'Off';
           $('cd').innerHTML='<h2>Quick settings</h2><div class="row">'+R('b-','Brightness − '+qs.b+'%')+R('b+','Brightness +')+'</div><div class="row">'+R('v-','Volume − '+qs.v+'%')+R('v+','Volume +')+'</div><div class="row">'+R('wifi','Wi-Fi settings')+R('bt','Bluetooth settings')+'</div><div class="row">'+R('night','Night light: '+o(qs.night))+R('mute','Mute: '+o(qs.mute))+'</div><div style="color:var(--mu);font-size:14px">Brightness and night light work here. Wi-Fi, Bluetooth and volume open the TV\'s own controls in the real APK.</div><div class="row"><div class="t" tabindex="0" data-p="close">'+ic('check')+'Close</div></div>';
           $('pn').classList.add('o');const e=$('cd').querySelector('[data-q="'+f+'"]')||$('cd').querySelector('.t');e.focus()}
          function qAct(q){const c=(v,a,b)=>Math.max(a,Math.min(b,v));
           if(HAS&&(q=='v-'||q=='v+'))qs.v=Android.volume(q=='v+'?1:-1);else if(HAS&&q=='mute')qs.mute=Android.mute();else if(q=='b-')qs.b=c(qs.b-10,10,100);else if(q=='b+')qs.b=c(qs.b+10,10,100);else if(q=='v-')qs.v=c(qs.v-10,0,100);else if(q=='v+')qs.v=c(qs.v+10,0,100);else if(q=='wifi'||q=='bt'){if(HAS){Android.settings(q);return}say('In the APK this opens the TV\'s '+(q=='wifi'?'Wi-Fi':'Bluetooth')+' settings');return}else qs[q]=!qs[q];
           save();applyQ();qsPanel(q)}
          function gPanel(){$('cd').innerHTML='<h2>Games</h2><div class="row"><div class="t" tabindex="0" data-g="ttt">Tic-Tac-Toe</div><div class="t" tabindex="0" data-g="snake">Snake</div></div><div class="row"><div class="t" tabindex="0" data-p="close">'+ic('check')+'Close</div></div>';openP()}
          function game(g){if(g=='ttt')tttPanel();else snakePanel()}
          let tb=[],tm='';const WL=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
          function tw(b){for(const l of WL)if(b[l[0]]&&b[l[0]]==b[l[1]]&&b[l[1]]==b[l[2]])return b[l[0]];return b.every(Boolean)?'D':''}
          function tttPanel(){tb=Array(9).fill('');tm='Your turn (X)';tttDraw(4)}
          function tttDraw(f){$('cd').innerHTML='<h2>Tic-Tac-Toe</h2><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">'+tb.map((v,i)=>'<div class="t" tabindex="0" data-c="'+i+'" style="height:80px;font-size:44px;font-weight:700">'+v+'</div>').join('')+'</div><div style="color:var(--mu)">'+tm+'</div><div class="row"><div class="t" tabindex="0" data-g="ttt">New game</div><div class="t" tabindex="0" data-p="close">Close</div></div>';$('pn').classList.add('o');const e=$('cd').querySelector('[data-c="'+f+'"]');e&&e.focus()}
          function tttMove(i){if(tb[i]||tw(tb))return;tb[i]='X';let r=tw(tb);
           if(!r){const fr=tb.map((v,k)=>v?-1:k).filter(k=>k>=0),tr=p=>{for(const k of fr){const c=tb.slice();c[k]=p;if(tw(c)==p)return k}return -1};
            let m=tr('O');if(m<0)m=tr('X');if(m<0&&!tb[4])m=4;if(m<0)m=fr[Math.floor(Math.random()*fr.length)];tb[m]='O';r=tw(tb)}
           tm=r=='X'?'You win!':r=='O'?'Computer wins':r=='D'?'Draw':'Your turn (X)';tttDraw(i)}
          let rs=0;function resetAll(){try{localStorage.removeItem('wh')}catch(e){}favs=[{n:'Apps',i:'grid'},{n:'Media',i:'play'},{n:'YouTube',i:'play'},{n:'Files',i:'folder'}];theme='';wp='';qs={b:100,v:50,wifi:true,bt:false,night:false,mute:false};edit=false;grab=null;applyWp();applyQ();render();closeP();say('Launcher has been reset')}
          let snk=null;
          function stopSnake(){if(snk){clearInterval(snk.t);snk=null}}
          function snakePanel(){stopSnake();$('cd').innerHTML='<h2>Snake</h2><canvas id="cv" width="400" height="300" style="width:100%;border-radius:12px;background:#0008"></canvas><div id="sc" style="color:var(--mu)">Use the arrow keys</div><div class="row"><div class="t" tabindex="0" data-g="snake">Restart</div><div class="t" tabindex="0" data-p="close">Close</div></div>';openP();
           snk={s:[[10,7],[9,7],[8,7]],d:[1,0],n:[1,0],f:[15,7],p:0,over:false};snk.t=setInterval(stepSnake,140)}
          function sdir(k){const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[k];if(m[0]!==-snk.d[0]||m[1]!==-snk.d[1])snk.n=m}
          function stepSnake(){if(!snk||!$('cv')){stopSnake();return}const g=snk;g.d=g.n;const h=[g.s[0][0]+g.d[0],g.s[0][1]+g.d[1]];
           if(h[0]<0||h[1]<0||h[0]>=20||h[1]>=15||g.s.some(c=>c[0]==h[0]&&c[1]==h[1])){g.over=true;clearInterval(g.t);$('sc').textContent='Game over · Score '+g.p;return}
           g.s.unshift(h);if(h[0]==g.f[0]&&h[1]==g.f[1]){g.p++;do{g.f=[Math.floor(Math.random()*20),Math.floor(Math.random()*15)]}while(g.s.some(c=>c[0]==g.f[0]&&c[1]==g.f[1]));$('sc').textContent='Score '+g.p}else g.s.pop();
           const x=$('cv').getContext('2d');x.clearRect(0,0,400,300);x.fillStyle='#ff4d4d';x.fillRect(g.f[0]*20+3,g.f[1]*20+3,14,14);x.fillStyle=getComputedStyle(document.body).getPropertyValue('--hi')||'#2ee6c5';g.s.forEach(c=>x.fillRect(c[0]*20+1,c[1]*20+1,18,18))}
          const ss=$('ss');let idle;
          function ssMove(){const c=$('sk');c.style.left=Math.random()*55+'%';c.style.top=Math.random()*65+'%';const d=new Date();c.children[0].textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});c.children[1].textContent=d.toLocaleDateString([], {weekday:'long',day:'numeric',month:'long'})}
          function wake(){clearTimeout(idle);idle=setTimeout(()=>{ss.classList.add('o');ssMove()},60000)}
          ['keydown','pointerdown'].forEach(ev=>addEventListener(ev,e=>{if(ss.classList.contains('o')){ss.classList.remove('o');ss._w=Date.now();e.stopPropagation();e.preventDefault()}wake()},true));addEventListener('click',e=>{if(Date.now()-(ss._w||0)<500){e.stopPropagation();e.preventDefault()}},true);
          setInterval(()=>{if(ss.classList.contains('o'))ssMove()},8000);
          render();document.querySelector('.hero').focus();if(HAS){try{qs.v=Android.volume(0);qs.mute=Android.isMuted()}catch(e){}}applyWp();applyQ();wake();
          </script></body></html>
