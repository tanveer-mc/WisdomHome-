name: Build Wisdom Home APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate project files
        run: |
          cat > settings.gradle <<'EOF_FILE_0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'WisdomHomeLauncherJava'
          include ':app'
          EOF_FILE_0
          cat > build.gradle <<'EOF_FILE_1'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_FILE_1
          cat > gradle.properties <<'EOF_FILE_2'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF_FILE_2
          mkdir -p app
          cat > app/build.gradle <<'EOF_FILE_3'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.wisdom.home'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.wisdom.home'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.1'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOF_FILE_3
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" />
              <application
                  android:allowBackup="false"
                  android:label="Wisdom Home"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:banner="@android:drawable/sym_def_app_icon"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <!-- Disabled by default. Enabled from Launcher settings > Home mode. -->
                  <activity-alias
                      android:name=".HomeAlias"
                      android:enabled="false"
                      android:exported="true"
                      android:targetActivity=".MainActivity">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity-alias>
              </application>
          </manifest>
          EOF_FILE_4
          mkdir -p app/src/main/java/com/wisdom/home
          cat > app/src/main/java/com/wisdom/home/MainActivity.java <<'EOF_FILE_5'
          package com.wisdom.home;

          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Color;
          import android.media.AudioManager;
          import android.media.tv.TvContract;
          import android.media.tv.TvInputInfo;
          import android.media.tv.TvInputManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Set;

          /**
           * Wisdom Home: the launcher UI (assets/index.html) runs inside a WebView and
           * talks to Android through the "Android" JavaScript bridge below.
           */
          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setStatusBarColor(Color.BLACK);
                  getWindow().setNavigationBarColor(Color.BLACK);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  enterImmersiveMode();

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.rgb(11, 18, 32));
                  webView.setFocusable(true);
                  webView.setFocusableInTouchMode(true);
                  webView.setOverScrollMode(View.OVER_SCROLL_NEVER);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true); // localStorage keeps launcher preferences
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setSupportMultipleWindows(false);
                  settings.setDefaultTextEncodingName("UTF-8");

                  webView.setWebViewClient(new WebViewClient() {
                      // The launcher page never navigates away; any web link opens outside.
                      @SuppressWarnings("deprecation")
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url != null && url.startsWith("file:")) return false;
                          if (url != null) startIntent(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                          return true;
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.addJavascriptInterface(new Bridge(), "Android");
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
                  webView.requestFocus();
              }

              private void enterImmersiveMode() {
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
              }

              // ---------- helpers ----------
              private void toast(final String s) {
                  runOnUiThread(new Runnable() {
                      @Override public void run() { Toast.makeText(MainActivity.this, s, Toast.LENGTH_LONG).show(); }
                  });
              }

              private boolean startIntent(Intent i) {
                  try {
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                      return true;
                  } catch (Exception e) {
                      toast("Could not open: " + e.getClass().getSimpleName());
                      return false;
                  }
              }

              private String norm(String s) {
                  return s.toLowerCase(Locale.ROOT).replaceAll("[^a-z0-9]", "");
              }

              /** Launchable apps as {label, package}, sorted by label. */
              private List<String[]> installed() {
                  PackageManager pm = getPackageManager();
                  List<String[]> list = new ArrayList<String[]>();
                  Set<String> seen = new HashSet<String>();
                  String[] cats = { Intent.CATEGORY_LEANBACK_LAUNCHER, Intent.CATEGORY_LAUNCHER };
                  for (String cat : cats) {
                      Intent q = new Intent(Intent.ACTION_MAIN).addCategory(cat);
                      for (ResolveInfo ri : pm.queryIntentActivities(q, 0)) {
                          String pkg = ri.activityInfo.packageName;
                          if (pkg.equals(getPackageName()) || !seen.add(pkg)) continue;
                          list.add(new String[] { String.valueOf(ri.loadLabel(pm)), pkg });
                      }
                  }
                  Collections.sort(list, new Comparator<String[]>() {
                      @Override public int compare(String[] a, String[] b) {
                          return a[0].toLowerCase(Locale.ROOT).compareTo(b[0].toLowerCase(Locale.ROOT));
                      }
                  });
                  return list;
              }

              private boolean launchPackage(String pkg) {
                  PackageManager pm = getPackageManager();
                  Intent i = pm.getLeanbackLaunchIntentForPackage(pkg);
                  if (i == null) i = pm.getLaunchIntentForPackage(pkg);
                  if (i == null) { toast("This app has no launch screen"); return false; }
                  return startIntent(i);
              }

              // ---------- JavaScript bridge ----------
              private class Bridge {
                  @JavascriptInterface
                  public String apps() {
                      JSONArray arr = new JSONArray();
                      try {
                          for (String[] a : installed()) {
                              JSONObject o = new JSONObject();
                              o.put("n", a[0]);
                              o.put("p", a[1]);
                              arr.put(o);
                          }
                      } catch (Exception ignored) { }
                      return arr.toString();
                  }

                  @JavascriptInterface
                  public boolean launch(String pkg) { return launchPackage(pkg); }

                  /** Launch the installed app whose name matches (case/space insensitive). */
                  @JavascriptInterface
                  public boolean launchLabel(String label) {
                      String t = norm(label);
                      List<String[]> all = installed();
                      for (String[] a : all) if (norm(a[0]).equals(t)) return launchPackage(a[1]);
                      for (String[] a : all) if (norm(a[0]).contains(t)) return launchPackage(a[1]);
                      return false;
                  }

                  @JavascriptInterface
                  public void settings(String what) {
                      String action;
                      if ("wifi".equals(what)) action = Settings.ACTION_WIFI_SETTINGS;
                      else if ("bt".equals(what)) action = Settings.ACTION_BLUETOOTH_SETTINGS;
                      else if ("display".equals(what)) action = Settings.ACTION_DISPLAY_SETTINGS;
                      else if ("network".equals(what)) action = Settings.ACTION_WIRELESS_SETTINGS;
                      else action = Settings.ACTION_SETTINGS;
                      startIntent(new Intent(action));
                  }

                  /** Try to switch to "HDMI 1", "AV 1", "ATV" ... Returns a message for the screen. */
                  @JavascriptInterface
                  public String input(String name) {
                      try {
                          TvInputManager tm = (TvInputManager) getSystemService(Context.TV_INPUT_SERVICE);
                          String nn = norm(name);
                          int type = nn.startsWith("hdmi") ? TvInputInfo.TYPE_HDMI
                                  : nn.startsWith("av") ? TvInputInfo.TYPE_COMPOSITE : TvInputInfo.TYPE_TUNER;
                          String digits = nn.replaceAll("\\D", "");
                          int num = digits.length() == 0 ? 1 : Integer.parseInt(digits);
                          List<TvInputInfo> match = new ArrayList<TvInputInfo>();
                          for (TvInputInfo ti : tm.getTvInputList()) if (ti.getType() == type) match.add(ti);
                          Collections.sort(match, new Comparator<TvInputInfo>() {
                              @Override public int compare(TvInputInfo a, TvInputInfo b) { return a.getId().compareTo(b.getId()); }
                          });
                          TvInputInfo pick = null;
                          for (TvInputInfo ti : match) {
                              if (norm(String.valueOf(ti.loadLabel(MainActivity.this))).equals(nn)) pick = ti;
                          }
                          if (pick == null && num >= 1 && num <= match.size()) pick = match.get(num - 1);
                          if (pick == null) return name + ": input not found on this TV";
                          if (pick.isPassthroughInput()) {
                              boolean ok = startIntent(new Intent(Intent.ACTION_VIEW,
                                      TvContract.buildChannelUriForPassthroughInput(pick.getId())));
                              return ok ? "Switching to " + name : "Could not switch to " + name;
                          }
                          boolean ok = startIntent(new Intent(Intent.ACTION_VIEW, TvContract.Channels.CONTENT_URI));
                          return ok ? "Opening TV" : "Could not open TV";
                      } catch (Exception e) {
                          return "Could not switch: " + e.getClass().getSimpleName();
                      }
                  }

                  /** delta in steps (+1 / -1), 0 just reads. Returns volume percent. */
                  @JavascriptInterface
                  public int volume(int delta) {
                      try {
                          AudioManager am = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                          int max = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC);
                          int cur = am.getStreamVolume(AudioManager.STREAM_MUSIC);
                          if (delta != 0) {
                              cur = Math.max(0, Math.min(max, cur + delta));
                              am.setStreamVolume(AudioManager.STREAM_MUSIC, cur, AudioManager.FLAG_SHOW_UI);
                          }
                          return max == 0 ? 0 : cur * 100 / max;
                      } catch (Exception e) { return 0; }
                  }

                  @JavascriptInterface
                  public boolean isMuted() {
                      try {
                          AudioManager am = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                          return am.isStreamMute(AudioManager.STREAM_MUSIC);
                      } catch (Exception e) { return false; }
                  }

                  @JavascriptInterface
                  public boolean mute() {
                      try {
                          AudioManager am = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                          boolean m = am.isStreamMute(AudioManager.STREAM_MUSIC);
                          am.adjustStreamVolume(AudioManager.STREAM_MUSIC,
                                  m ? AudioManager.ADJUST_UNMUTE : AudioManager.ADJUST_MUTE, AudioManager.FLAG_SHOW_UI);
                          return !m;
                      } catch (Exception e) { return false; }
                  }

                  @JavascriptInterface
                  public void openUrl(String url) { startIntent(new Intent(Intent.ACTION_VIEW, Uri.parse(url))); }

                  @JavascriptInterface
                  public void uninstall() {
                      setHome(false);
                      startIntent(new Intent(Intent.ACTION_DELETE, Uri.parse("package:" + getPackageName())));
                  }

                  @JavascriptInterface
                  public boolean homeEnabled() {
                      ComponentName alias = new ComponentName(MainActivity.this, "com.wisdom.home.HomeAlias");
                      return getPackageManager().getComponentEnabledSetting(alias)
                              == PackageManager.COMPONENT_ENABLED_STATE_ENABLED;
                  }

                  /** Turns Home mode on/off. On: Android asks which Home to use (choose "Just once" to test). */
                  @JavascriptInterface
                  public void setHome(boolean on) {
                      ComponentName alias = new ComponentName(MainActivity.this, "com.wisdom.home.HomeAlias");
                      getPackageManager().setComponentEnabledSetting(alias,
                              on ? PackageManager.COMPONENT_ENABLED_STATE_ENABLED : PackageManager.COMPONENT_ENABLED_STATE_DISABLED,
                              PackageManager.DONT_KILL_APP);
                      if (on) startIntent(new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME));
                  }

                  @JavascriptInterface
                  public String originalHome() {
                      Intent h = new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME);
                      for (ResolveInfo ri : getPackageManager().queryIntentActivities(h, 0)) {
                          if (ri.activityInfo.packageName.equals(getPackageName())) continue;
                          Intent i = new Intent(h);
                          i.setComponent(new ComponentName(ri.activityInfo.packageName, ri.activityInfo.name));
                          if (startIntent(i)) return "Opening " + ri.loadLabel(getPackageManager());
                      }
                      return "No other Home app found";
                  }
              }

              // ---------- remote control ----------
              private void sendWebKey(String key) {
                  if (webView == null) return;
                  String js = "document.dispatchEvent(new KeyboardEvent('keydown',{key:'" + key
                          + "',bubbles:true,cancelable:true}));";
                  webView.evaluateJavascript(js, null);
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent event) {
                  if (event.getAction() != KeyEvent.ACTION_DOWN) return super.dispatchKeyEvent(event);
                  switch (event.getKeyCode()) {
                      case KeyEvent.KEYCODE_DPAD_UP: sendWebKey("ArrowUp"); return true;
                      case KeyEvent.KEYCODE_DPAD_DOWN: sendWebKey("ArrowDown"); return true;
                      case KeyEvent.KEYCODE_DPAD_LEFT: sendWebKey("ArrowLeft"); return true;
                      case KeyEvent.KEYCODE_DPAD_RIGHT: sendWebKey("ArrowRight"); return true;
                      case KeyEvent.KEYCODE_DPAD_CENTER:
                      case KeyEvent.KEYCODE_ENTER:
                      case KeyEvent.KEYCODE_NUMPAD_ENTER:
                          if (event.getRepeatCount() == 0) sendWebKey("Enter");
                          return true;
                      case KeyEvent.KEYCODE_MENU:
                          if (event.getRepeatCount() == 0) sendWebKey("Menu");
                          return true;
                      case KeyEvent.KEYCODE_ESCAPE:
                          if (event.getRepeatCount() == 0) sendWebKey("Escape");
                          return true;
                      default: return super.dispatchKeyEvent(event);
                  }
              }

              @Override
              public void onBackPressed() { sendWebKey("Escape"); }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) enterImmersiveMode();
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  sendWebKey("Escape"); // Home button pressed again: close panels
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.loadUrl("about:blank");
                      webView.stopLoading();
                      webView.setWebChromeClient(null);
                      webView.setWebViewClient(null);
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF_FILE_5
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/index.html <<'EOF_FILE_6'
          <!DOCTYPE html>
          <html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>Wisdom Home Launcher</title>
          <style>
          :root{--bg:#0b1220;--bg2:#162033;--tile:#1a2438;--hi:#2ee6c5;--tx:#eef3f9;--mu:#8da0ba;--h1:#ff6b6b;--h2:#4361ee;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
          body.sunset{--bg:#1c0f1f;--bg2:#2e1630;--tile:#3a1d3b;--hi:#ffb703;--h1:#ff5d8f;--h2:#fb8500}
          body.forest{--bg:#0a1a14;--bg2:#12291f;--tile:#17352a;--hi:#9be564;--h1:#2a9d8f;--h2:#1b6b4a}
          body.light{--bg:#eef2f7;--bg2:#dde5f0;--tile:#fff;--hi:#e63946;--tx:#16202e;--mu:#53637a;--h1:#4cc9f0;--h2:#4361ee;color-scheme:light}
          *{box-sizing:border-box}
          html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,Roboto,sans-serif;overflow:hidden}
          #stage{position:fixed;left:50%;top:50%;width:1280px;height:720px;transform-origin:center;padding:36px 56px;display:flex;flex-direction:column;gap:20px;background:radial-gradient(900px 500px at 15% 0,var(--bg2),var(--bg))}
          .top{display:flex;justify-content:space-between;align-items:center}
          .brand{font-size:26px;font-weight:700}
          #clk{font-size:36px;font-weight:600}#dt{color:var(--mu);font-size:18px;margin-left:12px}
          .row{display:flex;gap:18px}
          .t{background:var(--tile);border-radius:16px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:19px;border:3px solid transparent;transition:transform .12s,border-color .12s;cursor:pointer;outline:none;color:var(--tx);position:relative}
          .t:focus{border-color:var(--hi);transform:scale(1.06);z-index:2;box-shadow:0 8px 24px #0006}
          .t.grab{border-style:dashed;transform:scale(1.1)}
          .ic{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
          .hero{width:500px;height:236px;background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;flex-direction:column;align-items:flex-start;justify-content:flex-end;padding:28px;gap:4px;font-size:34px;font-weight:700}
          .hero small{font-size:18px;font-weight:400;opacity:.92}
          .inputs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;flex:1}
          .inputs .t{justify-content:flex-start;padding-left:16px;font-size:17px}
          h3{margin:4px 0 0;font-size:19px;color:var(--mu);font-weight:500}
          .apps .t{width:196px;height:120px;flex-direction:column;gap:8px;font-size:18px}
          .apps .ic{width:40px;height:40px}
          .apps{flex-wrap:nowrap;overflow:visible}
          #eb{display:none;gap:12px;align-items:center}
          body.edit #eb{display:flex}
          #eb .t{height:50px;padding:0 20px;font-size:17px}#eb .ic{width:22px;height:22px}
          .hint{margin-top:auto;color:var(--mu);font-size:15px}
          #pn{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center}
          #pn.o{display:flex}
          .card{background:var(--bg2);border-radius:20px;padding:30px;width:560px;display:flex;flex-direction:column;gap:14px}
          .card h2{margin:0 0 4px;font-size:24px}
          .card .row .t{flex:1;height:70px;font-size:17px}
          .sw{width:22px;height:22px;border-radius:50%;flex:none}
          #toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--hi);color:#111;padding:8px 18px;border-radius:20px;font-weight:600;opacity:0;transition:opacity .2s;z-index:9;pointer-events:none}
          #pad{position:fixed;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(3,42px);gap:5px;z-index:8;opacity:.85}
          #pad button{height:42px;border-radius:50%;border:0;background:#2b3b55;color:#fff;font-size:14px}
          #pad button:active{background:var(--hi);color:#111}
          .apps{overflow-x:auto;padding:12px 6px;margin:-12px 0;scrollbar-width:none}.apps::-webkit-scrollbar{display:none}.apps .t{flex:none}
          .inputs .t{font-size:16px;gap:10px;padding-left:14px;white-space:nowrap}
          html,body{user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
          @media (hover:hover) and (pointer:fine){#pad{display:none}}
          @media (prefers-reduced-motion:reduce){.t,#sk{transition:none}}
          #in{user-select:text;-webkit-user-select:text}.inputs .ic{width:28px;height:28px}
          #cd.big{width:920px;max-height:640px;overflow-y:auto}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid3 .t{height:64px;font-size:16px;justify-content:flex-start;padding:0 14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:flex}
          .top .t{height:48px;padding:0 18px;font-size:16px;flex:none}.top .ic{width:22px;height:22px}
          #dim,#warm{position:fixed;inset:0;pointer-events:none;z-index:15}#dim{background:#000;opacity:0}#warm{background:#ff9a3c;mix-blend-mode:multiply;opacity:0}
          #ss{position:fixed;inset:0;background:#000;z-index:20;display:none;color:#fff}#ss.o{display:block}
          #sk{position:absolute;transition:left 2s,top 2s;font-size:96px;font-weight:300;line-height:1}#sk small{display:block;font-size:22px;color:#8da0ba;margin-top:8px}
          </style></head><body>
          <svg width="0" height="0" style="position:absolute"><defs>
          <symbol id="i-tv" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
          <symbol id="i-tvset" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/><circle cx="12" cy="10.5" r="2.5"/></symbol>
          <symbol id="i-av" viewBox="0 0 24 24"><circle cx="7" cy="12" r="3"/><circle cx="17" cy="12" r="3"/><path d="M10 12h4"/></symbol>
          <symbol id="i-hdmi" viewBox="0 0 24 24"><path d="M4 8h16v5l-3 4H7l-3-4z"/><path d="M9 12h6"/></symbol>
